
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111315">
  <title>STUDIO — Audio & Video</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111315;
      color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px;
      border-bottom: 1px solid #303438;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 22px; letter-spacing: 3px; }
    header span { color: #9ba3a8; font-size: 12px; }
    main { padding: 20px; max-width: 900px; margin: auto; }
    .welcome { margin: 25px 0; }
    .welcome h2 { font-size: 25px; margin-bottom: 8px; }
    .welcome p { color: #9ba3a8; line-height: 1.5; }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    button {
      background: #22272b;
      border: 1px solid #363d42;
      color: white;
      padding: 17px 10px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { background: #343c42; }
    .panel {
      margin-top: 22px;
      background: #1a1e21;
      border: 1px solid #30373b;
      border-radius: 14px;
      padding: 17px;
    }
    .panel h3 { margin-top: 0; }
    #preview {
      width: 100%;
      max-height: 300px;
      margin-top: 15px;
      border-radius: 10px;
      background: #090a0b;
    }
    #fileInfo { color: #9ba3a8; font-size: 13px; }
    .timeline {
      height: 85px;
      background: #101214;
      border: 1px dashed #485057;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #818b91;
      font-size: 13px;
      text-align: center;
      padding: 10px;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #687178;
      font-size: 12px;
    }
    input { display: none; }
    @media (max-width: 380px) {
      main { padding: 14px; }
      .welcome h2 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>STUDIO.</h1>
    <span>AUDIO & VIDEO</span>
  </header>

  <main>
    <section class="welcome">
      <h2>O teu estúdio criativo.</h2>
      <p>Cria, edita e transforma os teus projetos de áudio e vídeo num só lugar.</p>
    </section>

    <section class="actions">
      <button onclick="document.getElementById('audio').click()">+ Importar áudio</button>
      <button onclick="document.getElementById('video').click()">+ Importar vídeo</button>
    </section>

    <input id="audio" type="file" accept="audio/*">
    <input id="video" type="file" accept="video/*">

    <section class="panel">
      <h3>Pré-visualização</h3>
      <p id="fileInfo">Ainda não importaste nenhum ficheiro.</p>
      <video id="preview" controls playsinline hidden></video>
      <audio id="audioPreview" controls hidden></audio>
    </section>

    <section class="panel">
      <h3>Linha temporal</h3>
      <div class="timeline">A tua área de edição aparecerá aqui.</div>
    </section>
  </main>

  <footer>STUDIO. — Creative workspace</footer>

  <script>
    const audioInput = document.getElementById('audio');
    const videoInput = document.getElementById('video');
    const videoPreview = document.getElementById('preview');
    const audioPreview = document.getElementById('audioPreview');
    const fileInfo = document.getElementById('fileInfo');
    let currentURL = null;

    function loadMedia(file, type) {
      if (!file) return;
      if (currentURL) URL.revokeObjectURL(currentURL);
      currentURL = URL.createObjectURL(file);
      fileInfo.textContent = file.name + ' — ' +
        (file.size / (1024 * 1024)).toFixed(2) + ' MB';

      videoPreview.hidden = type !== 'video';
      audioPreview.hidden = type !== 'audio';

      if (type === 'video') {
        videoPreview.src = currentURL;
        audioPreview.pause();
        audioPreview.removeAttribute('src');
      } else {
        audioPreview.src = currentURL;
        videoPreview.pause();
        videoPreview.removeAttribute('src');
      }
    }

    audioInput.addEventListener('change', () => {
      loadMedia(audioInput.files[0], 'audio');
    });

    videoInput.addEventListener('change', () => {
      loadMedia(videoInput.files[0], 'video');
    });
  </script>
</body>
</html>
