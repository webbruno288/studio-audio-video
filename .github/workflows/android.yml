
name: Build KAPIA ONE PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore permanent release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KAPIA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KAPIA_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAPIA_RELEASE_KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "ERRO: Falta configurar uma das chaves secretas."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kapia-one-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/kapia-one-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Install dependencies
        run: npm install

      - name: Build web app for Android
        run: npm run build -- --mode android

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Download Gradle 8.14.3
        run: |
          curl -fL --retry 8 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 600 \
            https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.14.3-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" --version

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          gradle assembleDebug --no-daemon

      - name: Sign APK with permanent release key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KAPIA_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KAPIA_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAPIA_RELEASE_KEY_ALIAS }}
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNED="android/app/build/outputs/apk/debug/app-debug-signed.apk"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/kapia-one-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" "$APK"

          mv "$SIGNED" "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAPIA-ONE-PRO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 6
